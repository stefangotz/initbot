repos:
  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock check
        entry: uv lock --check
        language: unsupported
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0  # pragma: allowlist secret
    hooks:
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # v0.17.4  # pragma: allowlist secret
    hooks:
      - id: ruff
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: uv run ty check
        language: unsupported
        types: [python]
        args:
          - packages/initbot-core/src
          - packages/initbot-chat/src
          - packages/initbot-web/src
        pass_filenames: false
  - repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458  # v1.5.0  # pragma: allowlist secret
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1  # pragma: allowlist secret
    hooks:
      - id: shellcheck
        args: ["-x"]
  - repo: https://github.com/hadolint/hadolint
    rev: 2eece55955ced00200be9729e9728cb7dacca505  # v2.15.1  # pragma: allowlist secret
    hooks:
      - id: hadolint
  - repo: local
    hooks:
      - id: check-venv
        name: check if venv is synced
        description: Check if the project's virtual environment is in sync with the lock file. This ensures that the remaining pre-commit hooks run the same tool versions as in CI and as what is specified in the lock file. If this check fails, run `uv sync` to update the virtual environment.
        entry: uv sync --check
        language: unsupported
        pass_filenames: false
        always_run: true
      # Prevent tag-based pre-commit pins slipping in via manual edits or
      # automated updates. Local repo blocks never have a rev: field, so every
      # rev: line in this file belongs to an external repo and must be a
      # 40-char hex commit SHA.
      #
      # First grep extracts all rev: lines; second grep -v filters out those
      # that contain a 40-hex-char SHA. If anything survives, a tag-based pin
      # was found and ! flips the exit code to signal failure.
      - id: check-precommit-pins
        name: check pre-commit SHA pins
        entry: sh -c 'if grep -E "^\s+rev:" .pre-commit-config.yaml | grep -qvE "[0-9a-f]{40}"; then echo "pre-commit pins must use 40-char commit SHAs, not tags -- fix with pre-commit autoupdate --freeze"; exit 1; fi'
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: check-python-versions
        name: check-python-versions
        entry: uv run check-python-versions
        language: unsupported
        args:
          - packages/initbot-core
          - packages/initbot-chat
          - packages/initbot-web
        pass_filenames: false
        always_run: true
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: unsupported
        types: [python]
        pass_filenames: false
        always_run: true
      - id: reuse-tool
        name: reuse-tool
        # --no-multiprocessing: reuse uses ProcessPoolExecutor by default,
        # which requires semaphore creation. This fails in sandboxed
        # environments (e.g. nono) that block the sem_open syscall.
        entry: uv run reuse --no-multiprocessing lint
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: zizmor
        name: zizmor
        # keep aligned with CI (.github/workflows/pipeline.yaml)
        entry: uv run zizmor --no-progress --fix=safe .github/workflows/
        language: unsupported
        pass_filenames: false
        files: ^\.github/workflows/.*\.yml$
      - id: pylint
        name: pylint
        entry: uv run pylint
        language: unsupported
        types: [python]
        # keep aligned with CI (.github/workflows/pipeline.yaml)
        args: [--ignore, .venv, .]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest --ignore=tests/layout
        language: unsupported
        pass_filenames: false
        always_run: true
