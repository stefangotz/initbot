[project]
name = "initbot-web"
version = "0.1.0"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "datastar-py>=1.0.0",
    "initbot-core",
    "jinja2>=3.1",
    "starlette>=1.3.1",
    "uvicorn>=0.46.0",
    # itsdangerous is a dependency of starlette/middleware/sessions.py.
    # starlette declares it as optional, presumably to express that it is only required by users of middleware
    # initbot-web does use the starlette middleware.
    # Instead of installing all optional dependencies, we pull in this one explicitly
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    # The layout tests require python-multipart to use form parsing
    "python-multipart>=0.0.31",
]

[tool.uv]
constraint-dependencies = [
    "anyio<4.15",
]

[project.scripts]
initbot-web = "initbot_web.app:run"

[tool.uv.sources]
initbot-core = { workspace = true }

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
