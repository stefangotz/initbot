name: Mutation Testing

on:
  push:
    paths:
      - '**.py'
  pull_request:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]] ||
            git diff --name-only --no-renames "$BASE_SHA" "$GITHUB_SHA" | grep -qE '\.py$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  mutation-testing:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        package: [initbot-core, initbot-chat, initbot-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.changes.outputs.python == 'true'
        with:
          persist-credentials: false
      - name: Install uv
        if: needs.changes.outputs.python == 'true'
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.13.6"
          checksum: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"  # pragma: allowlist secret
          python-version: "3.15"
      - name: Install dependencies
        if: needs.changes.outputs.python == 'true'
        run: uv sync --python $(cat .python-version)
      - name: Run mutation testing
        if: needs.changes.outputs.python == 'true'
        env:
          api_key: x
        run: |
          set -euo pipefail

          package_path="packages/${{ matrix.package }}"
          cd "$package_path"
          ln -s ../../tests mutmut-tests
          ln -s ../../tools tools
          ln -s ../../uv.lock uv.lock

          case "${{ matrix.package }}" in
            initbot-core)
              export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/packages/initbot-chat/src:$GITHUB_WORKSPACE/packages/initbot-web/src"
              ;;
            initbot-chat)
              export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/packages/initbot-core/src:$GITHUB_WORKSPACE/packages/initbot-web/src"
              ;;
            initbot-web)
              export PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/packages/initbot-core/src:$GITHUB_WORKSPACE/packages/initbot-chat/src"
              ;;
          esac

          uv run --project ../.. mutmut run
          uv run --project ../.. mutmut results
          uv run --project ../.. mutmut export-cicd-stats
          jq -e '
            .total > 0 and
            (.killed + .survived + .no_tests + .skipped + .suspicious +
             .timeout + .check_was_interrupted_by_user + .segfault) == .total
          ' mutants/mutmut-cicd-stats.json
      - name: Upload mutation results
        if: needs.changes.outputs.python == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-results-${{ matrix.package }}
          path: packages/${{ matrix.package }}/mutants/mutmut-cicd-stats.json
          if-no-files-found: error
      - name: Skip mutation testing when no Python files changed
        if: needs.changes.outputs.python != 'true'
        run: echo "Python files were not changed; mutation testing was skipped."

  mutation-summary:
    name: mutation-summary
    if: always()
    needs: [changes, mutation-testing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Download mutation results
        if: needs.changes.outputs.python == 'true' && needs.mutation-testing.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-results-*
          path: mutation-results
      - name: Summarize results and enforce score gates
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          MUTATION_TESTING_RESULT: ${{ needs.mutation-testing.result }}
          PYTHON_CHANGED: ${{ needs.changes.outputs.python }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Python change detection finished with result: $CHANGES_RESULT" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$PYTHON_CHANGED" != "true" ]]; then
            echo "Python files were not changed; mutation testing was skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 tools/ci/report_mutmut_results.py mutation-results
